<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080f">
<title>DREAMSCAPE — Confluence v4 · Dual Screensaver</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07080f;color:#fff;font-family:system-ui,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#07080f}
#dock{position:fixed;z-index:10000;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:16px;background:rgba(6,10,20,.78);border:1px solid rgba(255,255,255,.17);box-shadow:0 8px 32px rgba(0,0,0,.38);backdrop-filter:blur(16px);white-space:nowrap;max-width:calc(100vw - 18px)}
#dock .brand{font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.62;padding:0 7px}
#dock button{appearance:none;border:1px solid rgba(255,255,255,.17);border-radius:10px;background:rgba(255,255,255,.07);color:#eff6ff;padding:8px 12px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.03em;cursor:pointer}
#dock button:hover{background:rgba(255,255,255,.17)}
#dock button.active{background:rgba(115,190,255,.26);border-color:rgba(145,210,255,.65)}
#dock button:disabled{opacity:.45;cursor:wait}
#state,#audioState{font-size:10px;opacity:.55;padding:0 6px}#audioState{color:#a8f0c6}
#stage{z-index:1}
@media(max-width:760px){#dock{flex-wrap:wrap;justify-content:center;white-space:normal}#dock button{padding:7px 8px;font-size:10px}}
#loading{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:10px;background:rgba(5,10,20,.6);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);pointer-events:none;transition:opacity .2s}
#loading.off{opacity:0}
#recover{display:none;position:fixed;z-index:11000;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(680px,calc(100vw - 28px));padding:12px 16px;border:1px solid rgba(255,190,120,.5);border-radius:12px;background:rgba(40,18,12,.92);color:#ffe0c6;font-size:12px;line-height:1.5;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#recover.show{display:block}
@media(max-width:620px){#dock{gap:4px;padding:6px}#dock .brand,#state{display:none}#dock button{padding:8px 9px;font-size:10px}}
</style>
</head>

<div id="recover" role="status"></div>

  <button type="button" id="audioBtn">System audio</button>

  <button type="button" id="fullBtn">Fullscreen</button>
  <span id="state">Scene 3 of 3</span><span id="audioState">Audio off</span>
</nav>

function decode64(value){
  const binary=atob(value);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

  const bgOld="bgX.globalCompositeOperation='source-over';bgX.fillStyle=dark?'#070d1a':'#f5efe2';bgX.fillRect(0,0,w,h);bgX.globalCompositeOperation=dark?'lighter':'multiply';";
  const bgNew="bgX.globalCompositeOperation='source-over';bgX.clearRect(0,0,w,h);if(!window.COMPOSITE_MODE){bgX.fillStyle=dark?'#070d1a':'#f5efe2';bgX.fillRect(0,0,w,h);}bgX.globalCompositeOperation=dark?'lighter':'multiply';";
  if(!s.includes(bgOld)) throw new Error('Rain background hook not found');
  s=s.replace(bgOld,bgNew);
  if(!s.includes('groundBase=H*.865;')) throw new Error('Rain ground-height hook not found');
  s=s.replace('groundBase=H*.865;','groundBase=H*.73;');
  const drawOld='ctx.drawImage(bgC,0,0,W,H);';
  const drawNew='if(window.COMPOSITE_MODE){ctx.drawImage(bgC,0,0,W,H);ctx.save();ctx.globalCompositeOperation="destination-in";var bgFade=ctx.createLinearGradient(0,0,0,H);bgFade.addColorStop(0,"rgba(255,255,255,0)");bgFade.addColorStop(.24,"rgba(255,255,255,.10)");bgFade.addColorStop(.56,"rgba(255,255,255,.55)");bgFade.addColorStop(1,"rgba(255,255,255,1)");ctx.fillStyle=bgFade;ctx.fillRect(0,0,W,H);ctx.restore();}else{ctx.drawImage(bgC,0,0,W,H);}';
  if(!s.includes(drawOld)) throw new Error('Rain background draw hook not found');
  s=s.replace(drawOld,drawNew);
  s=s.replace('function toggleFullscreen(){if(!document.fullscreenElement)','function toggleFullscreen(){if(window.COMPOSITE_MODE)return;if(!document.fullscreenElement)');
  s=s.replace('<script>','<script>window.COMPOSITE_MODE=true;');
  return s;
}
const shell=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>

function showError(message){recover.textContent=message;recover.classList.add('show');}
function setCompositeControls(mode){
  if(mode!== 'waves' && mode!== 'rain') mode='none';
  controlsMode=mode;
  wavesControlsBtn.classList.toggle('active',mode==='waves');
  rainControlsBtn.classList.toggle('active',mode==='rain');
  wavesControlsBtn.setAttribute('aria-pressed',String(mode==='waves'));
  rainControlsBtn.setAttribute('aria-pressed',String(mode==='rain'));
  try{
    const d=stage.contentDocument;
    if(!d)return;
    d.body.classList.toggle('controls-on',mode!=='none');
    const sky=d.getElementById('sky'),lake=d.getElementById('lake');
    if(sky){
      const active=mode==='waves';
      sky.style.zIndex=active?'12':'1';
      sky.style.clipPath=active?'inset(0 calc(100% - 340px) 0 0)':'none';
      if(sky.contentDocument&&sky.contentDocument.body)sky.contentDocument.body.classList.toggle('composite-controls',active);
    }
    if(lake){
      const active=mode==='rain';
      lake.style.zIndex=active?'12':'2';
      lake.style.clipPath=active?'inset(0 0 0 calc(100% - 310px))':'none';
      if(lake.contentDocument&&lake.contentDocument.body)lake.contentDocument.body.classList.toggle('composite-controls',active);
    }
  }catch(e){showError('Could not open the selected control panel: '+(e&&e.message||e));}
}
function toggleCompositePanel(mode){setCompositeControls(controlsMode===mode?'none':mode);}
async function attachAudioToCurrentScene(){
  if(!sharedAudioStream)return;
  try{
    if(current==='waves'){
      const w=stage.contentWindow;
      if(w&&typeof w.__wavesAttachStream==='function')await w.__wavesAttachStream(sharedAudioStream,sharedAudioKind);
      else throw new Error('Waves audio engine is not ready yet.');
    }else if(current==='rain'){
      const r=stage.contentWindow;
      if(r&&typeof r.__rainAttachStream==='function')await r.__rainAttachStream(sharedAudioStream,sharedAudioKind==='mic'?'mic':'system');
      else throw new Error('Watercolor audio engine is not ready yet.');
    }else{
      const d=stage.contentDocument;
      const sky=d&&d.getElementById('sky'),lake=d&&d.getElementById('lake');
      if(!sky||!lake)throw new Error('Composite audio frames are not ready yet.');
      if(typeof sky.contentWindow.__wavesAttachStream!=='function'||typeof lake.contentWindow.__rainAttachStream!=='function')throw new Error('One of the composite audio engines is still starting.');
      await Promise.all([
        sky.contentWindow.__wavesAttachStream(sharedAudioStream,sharedAudioKind),
        lake.contentWindow.__rainAttachStream(sharedAudioStream,sharedAudioKind==='mic'?'mic':'system')
      ]);
    }
    audioState.textContent='Audio connected';
  }catch(err){showError('Audio was captured but could not connect to both engines: '+(err&&err.message||err));}
}
async function connectHostAudio(kind){
  if(!navigator.mediaDevices){showError('This browser does not provide audio capture on this page. Open the HTML directly in Microsoft Edge or Chrome.');return;}
  const button=kind==='mic'?micBtn:audioBtn;
  button.disabled=true;
  try{
    let captured;
    if(kind==='mic'){
      if(!navigator.mediaDevices.getUserMedia)throw new Error('Microphone capture is unavailable.');
      captured=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false},video:false});
    }else{
      if(!navigator.mediaDevices.getDisplayMedia)throw new Error('System-audio capture is unavailable. Open the HTML directly in Edge or Chrome.');
      captured=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,systemAudio:'include',preferCurrentTab:false});
      if(!captured.getAudioTracks().length){captured.getTracks().forEach(t=>t.stop());throw new Error('No audio was shared. In the share dialog, choose a tab, window or screen and enable Share audio.');}
      captured.getVideoTracks().forEach(t=>t.stop());
    }
    if(sharedAudioStream)sharedAudioStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
    sharedAudioStream=new MediaStream(captured.getAudioTracks());
    sharedAudioKind=kind;
    sharedAudioStream.getAudioTracks().forEach(track=>track.addEventListener('ended',()=>{
      if(sharedAudioStream){sharedAudioStream=null;audioBtn.classList.remove('active');micBtn.classList.remove('active');audioState.textContent='Audio stopped';}
    },{once:true}));
    audioBtn.classList.toggle('active',kind==='system');
    micBtn.classList.toggle('active',kind==='mic');
    audioState.textContent=kind==='mic'?'Microphone starting':'System audio starting';
    recover.classList.remove('show');
    await attachAudioToCurrentScene();
  }catch(err){
    audioState.textContent='Audio unavailable';
    showError((kind==='mic'?'Microphone: ':'System audio: ')+(err&&err.message||String(err)));
  }finally{button.disabled=false;}
}
function stopHostAudio(){
  if(sharedAudioStream)sharedAudioStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
  sharedAudioStream=null;audioBtn.classList.remove('active');micBtn.classList.remove('active');audioState.textContent='Audio off';
}
window.__dreamscapeConnectAudio=connectHostAudio;
function finishLoading(){loading.classList.add('off');stage.style.opacity='1';}
function selectScene(name){
  if(!['waves','rain','composite'].includes(name))return;
  current=name;controlsMode='none';recover.classList.remove('show');
  clearTimeout(loadTimer);loading.textContent='Loading '+(name==='composite'?'Confluence':name==='rain'?'Watercolor Rain':'Waves');loading.classList.remove('off');

  rainControlsBtn.style.display=name==='composite'?'inline-block':'none';
  setCompositeControls('none');

  state.textContent=name==='waves'?'Scene 1 of 3':name==='rain'?'Scene 2 of 3':'Scene 3 of 3';
  stage.onload=()=>{
    if(name!=='composite'){finishLoading();if(sharedAudioStream)setTimeout(attachAudioToCurrentScene,120);return;}
    try{
      const d=stage.contentDocument;
      const sky=d&&d.getElementById('sky'),lake=d&&d.getElementById('lake');
      if(!sky||!lake){showError('Confluence did not initialize. Choose another scene, then try Confluence again.');return;}
      let ready=0,completed=false;
      const completeComposite=()=>{if(completed)return;completed=true;finishLoading();setCompositeControls('none');if(sharedAudioStream)setTimeout(attachAudioToCurrentScene,120);};
      const markReady=()=>{ready++;if(ready>=2)completeComposite();};
      sky.onload=markReady;lake.onload=markReady;
      sky.srcdoc=makeWavesComposite(source.waves);
      lake.srcdoc=makeRainComposite(source.rain);
      // Some local browser builds do not consistently forward nested-frame load events.
      setTimeout(()=>completeComposite(),1800);
    }catch(err){showError('Confluence error: '+(err&&err.message?err.message:String(err)));}
  };
  stage.srcdoc=name==='composite'?shell:source[name];

    if(current===name&&loading.classList.contains('off')===false){
      finishLoading();
      if(!stage.contentDocument||!stage.contentDocument.body||!stage.contentDocument.body.innerHTML){showError('The scene did not start. Try opening this HTML file in Microsoft Edge or Chrome.');}
    }
  },5000);
}
